services:
  catalog-movies-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - catalog-movies-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalog-movies-api:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_URL: jdbc:postgresql://catalog-movies-db:5432/${POSTGRES_DB:-postgres}
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      catalog-movies-db:
        condition: service_healthy

volumes:
  catalog-movies-data:
